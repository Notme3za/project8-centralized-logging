module(load="imtcp")

template(name="RemoteAuthLog" type="string"
         string="/var/log/remote/%HOSTNAME%/auth.log")

ruleset(name="remoteAuth") {
    if ($syslogfacility-text == "authpriv" or $syslogfacility-text == "auth") then {
        action(type="omfile"
               dynaFile="RemoteAuthLog"
               createDirs="on"
               dirCreateMode="0750"
               fileCreateMode="0640")
        stop
    }
}

input(type="imtcp" port="514" address="192.168.100.55" ruleset="remoteAuth")
input(type="imtcp" port="514" address="127.0.0.1" ruleset="remoteAuth")
